<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión | Barcos Históricos</title>
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="contenedor-auth">
    <div class="tarjeta-auth">
      <h1>⚓ Barcos Históricos</h1>
      <p class="subtitulo">Inicia sesión para administrar tu registro</p>

      <div id="mensaje" class="mensaje"></div>

      <form id="formLogin">
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" required />
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" required />
        </div>
        <button type="submit" class="boton">Iniciar sesión</button>
      </form>

      <p class="enlace-auth">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
