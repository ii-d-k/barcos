<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro | Barcos Históricos</title>
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="contenedor-auth">
    <div class="tarjeta-auth">
      <h1>⚓ Barcos Históricos</h1>
      <p class="subtitulo">Crea tu cuenta para empezar a registrar embarcaciones</p>

      <div id="mensaje" class="mensaje"></div>

      <form id="formRegistro">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required />
        </div>
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" required />
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" minlength="6" required />
        </div>
        <div class="campo">
          <label for="confirmarClave">Confirmar contraseña</label>
          <input type="password" id="confirmarClave" minlength="6" required />
        </div>
        <button type="submit" class="boton">Registrarse</button>
      </form>

      <p class="enlace-auth">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>

  <script src="js/registro.js"></script>
</body>
</html>
